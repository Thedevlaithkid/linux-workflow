name: Build Ubuntu ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Custom release version (e.g. 1.0.0)"
        required: false
        default: ""
      ubuntu_series:
        description: "Ubuntu release codename"
        required: false
        default: "noble"
      flavor:
        type: choice
        description: "Flavor / desktop"
        options:
          - xubuntu-desktop
          - ubuntu-desktop
          - ubuntu-desktop-minimal
          - kubuntu-desktop
          - lubuntu-desktop
          - xfce4
          - none (server)
        default: "xubuntu-desktop"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools

      - name: Configure live-build
        env:
          SERIES: ${{ inputs.ubuntu_series }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          mkdir -p ubuntu-live
          cd ubuntu-live
          lb config \
            --distribution "${SERIES}" \
            --architectures amd64 \
            --mode ubuntu \
            --archive-areas "main universe multiverse" \
            --binary-images iso-hybrid \
            --linux-flavours generic \
            --iso-volid "UBUNTU_CUSTOM" \
            --iso-application "DevLaith Ubuntu"

      - name: Select flavor packages
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          cd ubuntu-live
          echo "${FLAVOR}" > config/package-lists/flavor.list.chroot

      - name: Build ISO
        run: |
          cd ubuntu-live
          sudo lb build

      - name: Stage ISO
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          [ -z "$VERSION" ] && VERSION="$(date +%Y.%m.%d-%H%M%S)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          sudo cp ubuntu-live/live-image-amd64.hybrid.iso "dist/ubuntu-${VERSION}.iso"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-iso
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "dist/ubuntu-${VERSION}.iso" \
            --title "DevLaith Ubuntu v${VERSION}" \
            --notes "Custom Ubuntu ${{ inputs.ubuntu_series }} build from commit ${GITHUB_SHA}."