name: Build Ubuntu Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Custom release version (e.g. 1.0.0)"
        required: false
        default: ""
      ubuntu_series:
        description: "Ubuntu release codename (e.g. noble, warty)"
        required: false
        default: "noble"
      architectures:
        type: choice
        description: "Architecture (i386 for pre-6.06 releases)"
        options:
          - amd64
          - i386
        default: "amd64"
      output_format:
        type: choice
        description: "What to produce"
        options:
          - rootfs-tarball
          - live-iso
        default: "rootfs-tarball"
      linux_flavours:
        description: "Kernel flavour for live-iso (e.g. generic, 386, k7)"
        required: false
        default: "generic"
      flavor:
        type: choice
        description: "Flavor / desktop for live-iso"
        options:
          - xubuntu-desktop
          - ubuntu-desktop
          - ubuntu-desktop-minimal
          - kubuntu-desktop
          - lubuntu-desktop
          - xfce4
          - none (server)
        default: "xubuntu-desktop"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools live-build

      - name: Detect Ubuntu mirror
        id: mirror
        env:
          SERIES: ${{ inputs.ubuntu_series }}
          REQUESTED_ARCH: ${{ inputs.architectures }}
        run: |
          if curl -sf "http://archive.ubuntu.com/ubuntu/dists/${SERIES}/Release" -o /dev/null; then
            echo "MIRROR=http://archive.ubuntu.com/ubuntu/" >> "$GITHUB_ENV"
            echo "OLD=false" >> "$GITHUB_ENV"
            echo "P: Using archive.ubuntu.com for ${SERIES}"
            echo "ARCH=${REQUESTED_ARCH}" >> "$GITHUB_OUTPUT"
          else
            echo "MIRROR=http://old-releases.ubuntu.com/ubuntu/" >> "$GITHUB_ENV"
            echo "OLD=true" >> "$GITHUB_ENV"
            echo "P: ${SERIES} is EOL, using old-releases.ubuntu.com"
            # Ubuntu only started shipping amd64 with 5.10 (breezy). For older
            # releases force i386 regardless of the requested arch.
            if [ "${REQUESTED_ARCH}" = "amd64" ]; then
              echo "P: ${SERIES} predates amd64 (first amd64 release: breezy 5.10), forcing i386"
              echo "ARCH=i386" >> "$GITHUB_OUTPUT"
            else
              echo "ARCH=${REQUESTED_ARCH}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bootstrap rootfs with debootstrap
        env:
          SERIES: ${{ inputs.ubuntu_series }}
          ARCH: ${{ steps.mirror.outputs.ARCH }}
          MIRROR: ${{ env.MIRROR }}
          OLD: ${{ env.OLD }}
        run: |
          sudo mkdir -p rootfs
          if [ "${OLD}" = "true" ]; then
            sudo apt-get install -y qemu-user-static >/dev/null
            set +e
            sudo env SHA_SIZE=1 debootstrap \
              --arch "${ARCH}" --no-check-gpg "${SERIES}" rootfs "${MIRROR}" > /tmp/ds-full.log 2>&1
            RC=$?
            set -e
            if [ ${RC} -ne 0 ]; then
              echo "=== FULL debootstrap failed (${RC}); switching to --foreign + qemu ==="
              sudo tail -n 30 /tmp/ds-full.log
              sudo tail -n 30 rootfs/debootstrap/debootstrap.log 2>/dev/null || true
              sudo rm -rf rootfs
              sudo mkdir -p rootfs/usr/bin
              sudo cp /usr/bin/qemu-i386-static rootfs/usr/bin/ 2>/dev/null || true
              sudo env SHA_SIZE=1 debootstrap \
                --arch "${ARCH}" --no-check-gpg --foreign "${SERIES}" rootfs "${MIRROR}" > /tmp/ds-foreign.log 2>&1
              echo "=== FOREIGN debootstrap exit: $? ==="
              if [ "${ARCH}" = "i386" ]; then
                sudo chroot rootfs /debootstrap/debootstrap --second-stage > /tmp/ds-2nd.log 2>&1
                echo "=== SECOND-STAGE exit: $? ==="
              fi
              sudo tail -n 40 /tmp/ds-foreign.log
              sudo tail -n 40 /tmp/ds-2nd.log 2>/dev/null || true
            fi
          else
            sudo debootstrap --arch "${ARCH}" "${SERIES}" rootfs "${MIRROR}"
          fi

      - name: Build live-iso (modern releases only)
        if: ${{ inputs.output_format == 'live-iso' && env.OLD == 'false' }}
        env:
          SERIES: ${{ inputs.ubuntu_series }}
          ARCH: ${{ steps.mirror.outputs.ARCH }}
          KFLAVOUR: ${{ inputs.linux_flavours }}
          FLAVOR: ${{ inputs.flavor }}
          MIRROR: ${{ env.MIRROR }}
        run: |
          mkdir -p ubuntu-live
          cd ubuntu-live
          lb config \
            --distribution "${SERIES}" \
            --architectures "${ARCH}" \
            --mode ubuntu \
            --archive-areas "main universe multiverse" \
            --binary-images iso-hybrid \
            --linux-flavours "${KFLAVOUR}" \
            --iso-volume "UBUNTU_CUSTOM" \
            --iso-application "DevLaith Ubuntu" \
            --parent-mirror-bootstrap "${MIRROR}" \
            --parent-mirror-chroot "${MIRROR}" \
            --parent-mirror-binary "${MIRROR}"
          case "${FLAVOR}" in
            "none (server)") : > config/package-lists/flavor.list.chroot ;;
            *) echo "${FLAVOR}" > config/package-lists/flavor.list.chroot ;;
          esac
          sudo lb build

      - name: Stage image
        env:
          SERIES: ${{ inputs.ubuntu_series }}
          ARCH: ${{ steps.mirror.outputs.ARCH }}
          OLD: ${{ env.OLD }}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          [ -z "$VERSION" ] && VERSION="$(date +%Y.%m.%d-%H%M%S)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ "${{ inputs.output_format }}" = "live-iso" ] && [ "${OLD}" = "false" ]; then
            sudo cp ubuntu-live/"live-image-${ARCH}.hybrid.iso" "dist/ubuntu-${VERSION}-${SERIES}-${ARCH}.iso"
          else
            # Warty (2004) predates the live CD (first was Hoary 5.04), so
            # legacy releases ship as a rootfs tarball.
            echo "${{ github.event_name }}: legacy release -> rootfs tarball"
            sudo tar -C rootfs -czf "dist/ubuntu-${VERSION}-${SERIES}-${ARCH}.tar.gz" .
          fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-image
          path: dist/

      - name: Upload bootstrap logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: |
            /tmp/ds-*.log
            /home/runner/work/linux-workflow/linux-workflow/rootfs/debootstrap/debootstrap.log

      - name: Print diagnostics
        if: ${{ always() }}
        run: |
          echo "=== /tmp/ds-full.log ==="; sudo tail -n 80 /tmp/ds-full.log 2>/dev/null || true
          echo "=== /tmp/ds-foreign.log ==="; sudo tail -n 60 /tmp/ds-foreign.log 2>/dev/null || true
          echo "=== /tmp/ds-2nd.log ==="; sudo tail -n 60 /tmp/ds-2nd.log 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" dist/ubuntu-* \
            --title "DevLaith Ubuntu v${VERSION}" \
            --notes "Custom Ubuntu ${{ inputs.ubuntu_series }}/${{ inputs.architectures }} build from commit ${GITHUB_SHA}."